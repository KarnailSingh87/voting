# Render Blueprint – single Web Service hosting backend + both SPAs
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: securevote
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://voting-xr9p.onrender.com
      - key: FRONTEND_URL
        value: https://voting-xr9p.onrender.com
      - key: ADMIN_URL
        value: https://voting-xr9p.onrender.com/admin
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    healthCheckPath: /health
